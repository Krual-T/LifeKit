# Copy to .codex/config.toml after creating the instance instructions file.
# Paths are relative to the .codex directory containing this configuration.
model_instructions_file = "model-instructions/Assistant.instructions.md"

# Start Codex with this instance's .venv/bin on PATH; trust this Hook in the host.
[[hooks.PostToolUse]]
matcher = "^(apply_patch|Bash)$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.agents/skills/memory-pack/using-wiki/scripts/wiki_sync_hook.py"'
timeout = 30
